version: 0.2

env:
  variables:
    NODE_ENV: "production"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing backend dependencies..."
      - cd $CODEBUILD_SRC_DIR/backend
      - npm ci
      - echo "Installing frontend dependencies..."
      - cd $CODEBUILD_SRC_DIR/frontend
      - npm ci

  pre_build:
    commands:
      - echo "Build started on `date`"
      - cd $CODEBUILD_SRC_DIR
      - node -v
      - npm -v

  build:
    commands:
      - echo "Building Angular frontend..."
      - cd $CODEBUILD_SRC_DIR/frontend
      - npm run build -- --configuration production
      - echo "Copying frontend build output into backend..."
      - mkdir -p $CODEBUILD_SRC_DIR/backend/frontend/dist/space-site
      - cp -r $CODEBUILD_SRC_DIR/frontend/dist/space-site/browser $CODEBUILD_SRC_DIR/backend/frontend/dist/space-site/browser

  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Pruning backend to production dependencies only..."
      - cd $CODEBUILD_SRC_DIR/backend
      - npm prune --omit=dev

artifacts:
  base-directory: backend
  files:
    - '**/*'
  exclude-paths:
    - node_modules/.cache/**/*

cache:
  paths:
    - 'frontend/node_modules/**/*'
    - 'backend/node_modules/**/*'
