version: 0.2

env:
  variables:
    NODE_ENV: "production"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing backend dependencies..."
      - cd backend && npm ci
      - cd ..
      - echo "Installing frontend dependencies..."
      - cd frontend && npm ci
      - cd ..

  pre_build:
    commands:
      - echo "Build started on `date`"
      - node -v
      - npm -v

  build:
    commands:
      - echo "Building Angular frontend..."
      - cd frontend
      - npx ng build --configuration production
      - cd ..
      - echo "Copying frontend build output into backend..."
      - mkdir -p backend/frontend/dist/space-site
      - cp -r frontend/dist/space-site/browser backend/frontend/dist/space-site/browser

  post_build:
    commands:
      - echo "Build completed on `date`"
      - echo "Pruning backend to production dependencies only..."
      - cd backend && npm prune --omit=dev && cd ..

artifacts:
  base-directory: backend
  files:
    - '**/*'
  exclude-paths:
    - node_modules/.cache/**/*

cache:
  paths:
    - 'frontend/node_modules/**/*'
    - 'backend/node_modules/**/*'
